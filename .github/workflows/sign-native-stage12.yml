name: Build and sign Walkman Studio Native production release

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: sign-native-production

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and verify the reviewed source
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 -m unittest discover -s qa -p test_production_policy.py
          python3 qa/production_policy.py certificateSha256
          sdkmanager --channel=3 'platforms;android-36' 'build-tools;35.0.0' 'ndk;30.0.16248370' 'cmake;3.22.1'
          ./gradlew --console=plain --max-workers=2 \
            :core:test :playback:hostNative :library:testDebugUnitTest \
            :playback:testDebugUnitTest :app:testDebugUnitTest :app:assembleRelease \
            :app:lintRelease :library:lintRelease :playback:lintRelease
      - name: Save release inputs and build the first-release OTA probe
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          inputs="$RUNNER_TEMP/production-signing-input"
          mkdir -p "$inputs"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$inputs/release.apk"
          cp app/build/outputs/mapping/release/mapping.txt "$inputs/mapping.txt"
          if [[ "$(python3 qa/production_policy.py tag)" == stage12 ]]; then
            trap 'git restore -- release/production.properties' EXIT
            sed -i 's/^versionCode=108$/versionCode=109/; s/^versionName=.*/versionName=1.4.0-audio-engine-ota-probe/' release/production.properties
            ./gradlew --console=plain --max-workers=2 :app:assembleRelease
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$inputs/ota-probe.apk"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-signing-input
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/production-signing-input/

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: production-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-signing-input
          path: ${{ runner.temp }}/production-signing-input
      - name: Install APK verification tools
        run: sdkmanager --channel=3 'build-tools;35.0.0' 'ndk;30.0.16248370'
      - name: Sign using the reviewed production key
        env:
          BACKED_UP_CERTIFICATE: ${{ vars.WALKMAN_BACKED_UP_CERTIFICATE_SHA256 }}
          WALKMAN_SIGNING_KEYSTORE_B64: ${{ secrets.WALKMAN_SIGNING_KEYSTORE_B64 }}
          WALKMAN_SIGNING_STORE_PASSWORD: ${{ secrets.WALKMAN_SIGNING_STORE_PASSWORD }}
          WALKMAN_SIGNING_KEY_ALIAS: ${{ secrets.WALKMAN_SIGNING_KEY_ALIAS }}
          WALKMAN_SIGNING_KEY_PASSWORD: ${{ secrets.WALKMAN_SIGNING_KEY_PASSWORD }}
        run: |
          expected="$(python3 qa/production_policy.py certificateSha256)"
          if [[ "$BACKED_UP_CERTIFICATE" != "$expected" ]]; then
            echo 'The owner must attest to a restored encrypted backup for this certificate.' >&2
            exit 1
          fi
          for name in WALKMAN_SIGNING_KEYSTORE_B64 WALKMAN_SIGNING_STORE_PASSWORD WALKMAN_SIGNING_KEY_ALIAS WALKMAN_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              printf 'Required signing secret missing: %s\n' "$name" >&2
              exit 1
            fi
          done
          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/walkman-keystore.XXXXXXXX")"
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$WALKMAN_SIGNING_KEYSTORE_B64" | base64 --decode > "$keystore"
          unset WALKMAN_SIGNING_KEYSTORE_B64
          certificate="$(keytool -exportcert -keystore "$keystore" \
            -alias "$WALKMAN_SIGNING_KEY_ALIAS" -storepass:env WALKMAN_SIGNING_STORE_PASSWORD | sha256sum)"
          if [[ "${certificate%% *}" != "$expected" ]]; then
            echo 'The supplied signing entry does not match the reviewed production certificate.' >&2
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/35.0.0"
          inputs="$RUNNER_TEMP/production-signing-input"
          sign_apk() {
            "$tools/zipalign" -c -P 16 4 "$1"
            "$tools/apksigner" sign --ks "$keystore" \
              --ks-key-alias "$WALKMAN_SIGNING_KEY_ALIAS" \
              --ks-pass env:WALKMAN_SIGNING_STORE_PASSWORD \
              --key-pass env:WALKMAN_SIGNING_KEY_PASSWORD \
              --out "$2" "$1"
          }
          sign_apk "$inputs/release.apk" "$RUNNER_TEMP/stage12-signed.apk"
          if [[ "$(python3 qa/production_policy.py tag)" == stage12 ]]; then
            mkdir "$RUNNER_TEMP/production-ota-probe"
            sign_apk "$inputs/ota-probe.apk" "$RUNNER_TEMP/production-ota-probe/ota-probe.apk"
          fi
      - name: Verify continuity and prepare the reviewed distribution
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p app/build/outputs/mapping/release
          cp "$RUNNER_TEMP/production-signing-input/mapping.txt" app/build/outputs/mapping/release/mapping.txt
          python3 qa/prepare-audio-engine-ota.py "$RUNNER_TEMP/stage12-signed.apk" "$RUNNER_TEMP/stage12-staged"
      - name: Validate the first-release OTA probe pair
        run: |
          if [[ "$(python3 qa/production_policy.py tag)" == stage12 ]]; then
            python3 qa/verify-production-ota-probe.py "$ANDROID_HOME/build-tools/35.0.0" \
              "$RUNNER_TEMP/stage12-signed.apk" "$RUNNER_TEMP/production-ota-probe/ota-probe.apk"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage12-verified-distribution
          path: ${{ runner.temp }}/stage12-staged/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-ota-probe-test-only
          path: ${{ runner.temp }}/production-ota-probe/
          if-no-files-found: ignore
          retention-days: 3
